<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1444" height="696" viewBox="0 0 1444 696" fill="none" role="img" aria-labelledby="mpbg-title mpbg-desc">
  <title id="mpbg-title">MetaPumpkin Halloween landscape</title>
  <desc id="mpbg-desc">A text-free peach Halloween background with a cream moon, three clouds, two separately grouped bats, layered autumn hills, a haunted house, bare trees, and a small orange pumpkin. Rounded card with transparent outside corners. No large flying MetaBot is included.</desc>
  <defs>
    <linearGradient id="mpbg-sky-fill" x1="140" y1="0" x2="1200" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBD6B7"/><stop offset="0.5" stop-color="#FDD8B8"/><stop offset="1" stop-color="#FBD4B2"/>
    </linearGradient>
    <linearGradient id="mpbg-moon-fill" x1="1100" y1="42" x2="1205" y2="397" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCECD9"/><stop offset="1" stop-color="#FBE7CF"/>
    </linearGradient>
    <linearGradient id="mpbg-far-fill" x1="0" y1="510" x2="1444" y2="647" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D49D97"/><stop offset="1" stop-color="#CE9891"/>
    </linearGradient>
    <linearGradient id="mpbg-mid-fill" x1="0" y1="555" x2="1444" y2="674" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BF6244"/><stop offset="0.55" stop-color="#C56847"/><stop offset="1" stop-color="#B95C40"/>
    </linearGradient>
    <linearGradient id="mpbg-front-fill" x1="0" y1="610" x2="1444" y2="696" gradientUnits="userSpaceOnUse">
