    </linearGradient>
    <linearGradient id="mpbg-bat-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#533144"/><stop offset="1" stop-color="#3F2635"/>
    </linearGradient>
    <linearGradient id="mpbg-window-fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFBA66"/><stop offset="1" stop-color="#F4A34E"/>
    </linearGradient>
    <linearGradient id="mpbg-pumpkin-fill" x1="-20" y1="-34" x2="28" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F28C44"/><stop offset="1" stop-color="#F49A4D"/>
    </linearGradient>
    <clipPath id="mpbg-card-clip"><rect width="1444" height="696" rx="72"/></clipPath>
  </defs>
